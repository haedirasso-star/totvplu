name: نشر الموقع

on:
  push:
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [app-update]   # ★ عند «إرسال التحديث» من تطبيق الإدارة ⇐ زر التحميل يشير للإصدار الجديد فوراً

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: استرجاع الأرشيف والصور
        uses: actions/cache@v4
        with:
          path: .cache
          key: site-cache-${{ github.run_id }}
          restore-keys: site-cache-
      - name: البناء
        run: node scripts/build.mjs
        env:
          FEED_URL: ${{ vars.FEED_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
